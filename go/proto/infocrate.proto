syntax = "proto3";

package infocrate;

option go_package = "github.com/infocrate/infocrate/pkg/proto;infocratepb";

// --- Client Facing API ---
service InfoCrate {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc ClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {
  bool success = 1;
  string leader_id = 2; // Redirects client if wrong node queried
  string error_message = 3;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  string leader_id = 3;
  string error_message = 4;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
  string leader_id = 2;
  string error_message = 3;
}

message ClusterStatusRequest {}

message NodeInfo {
  string node_id = 1;
  string shard_id = 2;
  string role = 3; // "LEADER", "FOLLOWER", "CANDIDATE"
  uint64 current_term = 4;
  uint64 commit_index = 5;
  string grpc_addr = 6;
  bool is_healthy = 7;
}

message ClusterStatusResponse {
  repeated NodeInfo nodes = 1;
  uint32 total_shards = 2;
}

// --- Raft Consensus API ---
service RaftConsensus {
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  string command_type = 3; // "PUT" or "DELETE"
  string key = 4;
  bytes value = 5;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}
